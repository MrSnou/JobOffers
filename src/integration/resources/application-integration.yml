spring:
    application:
        name: jobOffers
    data:
        mongodb:
            auto-index-creation: true


job_offers:
    api:
        base-url: http://localhost:8080
        connection-timeout: 1000
        read-timeout: 1000
    scheduler:
        enabled: false
        time-cron: "* * * * * ?" # Every second

auth:
    jwt:
        secret-key: test-secret-key-for-integration-tests
        issuer: "JobOffersApi - Backend"
        expiration-time-in-seconds: 720